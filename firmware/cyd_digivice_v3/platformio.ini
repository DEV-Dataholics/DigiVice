; PlatformIO Project Configuration for ESP32-2432S028 (CYD - 2.8" TFT Touch)
; Digivice v3.0 Cyberpunk Edition

[env:esp32-2432S028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I .
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    lvgl/lvgl @ ^8.3.11
    bblanchon/ArduinoJson @ ^6.21.4
